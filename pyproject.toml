[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "microsoft-365-agent-integration"
version = "0.1.0"
description = "Sanitized MCP and Microsoft Graph reference integration for an AI agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Guimaraes" }]
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
m365-mcp-stdio = "m365_agent_integration.stdio_server:main"
m365-mcp-sdk-stdio = "m365_agent_integration.sdk_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/m365_agent_integration"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["m365_agent_integration"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 80
